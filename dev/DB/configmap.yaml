apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-configmap
  namespace: dev
data:
  my.cnf: |
    [mysqld]
    innodb_buffer_pool_size = 64M
    innodb_log_buffer_size = 8M
    key_buffer_size = 8M

    performance_schema = OFF
    query_cache_type = 0
    query_cache_size = 0

    max_connections = 30
    thread_cache_size = 2

    innodb_flush_log_at_trx_commit = 2
    sync_binlog = 0
