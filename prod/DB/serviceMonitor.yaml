apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mariadb-exporter-svc-mon
  namespace: monitoring
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: mariadb-exporter-svc
  namespaceSelector:
    matchNames:
      - ENV_NAME
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s